[project]
name = "backend"
version = "0.1.0"
description = "API server for the coding-assignment app"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.16.2",
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "ruff>=0.13,<1",
    "mypy>=1.18,<2",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.22",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.repos", "app.jobs", "app.clients", "app.ai", "app.routers"]

[tool.setuptools.package-data]
"app.ai" = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]
