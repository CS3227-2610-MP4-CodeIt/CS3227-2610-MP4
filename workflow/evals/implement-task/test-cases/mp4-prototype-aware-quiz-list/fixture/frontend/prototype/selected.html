<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Approved student quiz list</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
        color: #172b3a;
        background: #f4f7fa;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #f4f7fa; }
      main { width: min(960px, calc(100% - 48px)); margin: 0 auto; padding: 40px 0 56px; }
      h1 { margin: 0 0 24px; font-size: 32px; line-height: 1.2; letter-spacing: -0.5px; }
      .search { display: block; width: min(440px, 100%); margin: 0 0 24px; }
      .search span { display: block; margin-bottom: 8px; color: #425466; font-size: 14px; font-weight: 600; }
      .search input { width: 100%; height: 44px; border: 1px solid #9aabba; border-radius: 8px; background: #fff; padding: 0 12px; color: #172b3a; font: inherit; }
      .quiz-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      article { min-height: 184px; border: 1px solid #d7e0e8; border-radius: 12px; background: #fff; padding: 20px; box-shadow: 0 2px 8px rgb(23 43 58 / 5%); }
      .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      h2 { margin: 0; font-size: 20px; line-height: 1.3; }
      .status { flex: 0 0 auto; border-radius: 999px; background: #e9f2f8; color: #24516b; padding: 5px 9px; font-size: 12px; font-weight: 700; }
      .course { margin: 8px 0 4px; color: #425466; font-size: 14px; }
      .count { margin: 0; color: #627486; font-size: 13px; }
      .action { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; margin-top: 16px; border-radius: 7px; background: #155eef; color: #fff; padding: 0 13px; text-decoration: none; font-size: 14px; font-weight: 700; }
      @media (max-width: 620px) {
        main { width: calc(100% - 32px); padding-top: 28px; }
        h1 { font-size: 28px; }
        .quiz-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
        article { min-height: 176px; padding: 18px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>My quizzes</h1>
      <label class="search">
        <span>Search quizzes</span>
        <input type="search" aria-label="Search quizzes" placeholder="Search by quiz or class" />
      </label>
      <section class="quiz-grid" aria-label="Quiz list">
        <article>
          <div class="card-top"><h2>Arrays</h2><span class="status">Not started</span></div>
          <p class="course">CS Alpha</p><p class="count">2 questions</p>
          <a class="action" href="#/student/attempt/7">Start</a>
        </article>
        <article>
          <div class="card-top"><h2>Trees</h2><span class="status">In progress</span></div>
          <p class="course">CS Beta</p><p class="count">4 questions</p>
          <a class="action" href="#/student/attempt/3">Resume</a>
        </article>
        <article>
          <div class="card-top"><h2>Regex a[</h2><span class="status">Submitted</span></div>
          <p class="course">CS Alpha</p><p class="count">1 question</p>
          <a class="action" href="#/student/results/9">View results</a>
        </article>
        <article>
          <div class="card-top"><h2>Graphs</h2><span class="status">Not started</span></div>
          <p class="course">CS Gamma</p><p class="count">3 questions</p>
          <a class="action" href="#/student/attempt/12">Start</a>
        </article>
      </section>
    </main>
  </body>
</html>
