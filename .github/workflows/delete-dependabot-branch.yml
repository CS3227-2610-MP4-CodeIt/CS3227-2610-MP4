name: Delete merged Dependabot branch

on:
  pull_request_target:
    types: [closed]

# pull_request_target provides the write token needed for Dependabot PRs.
# This workflow uses only event metadata and never checks out or runs PR code.
permissions:
  contents: write

jobs:
  delete-merged-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged Dependabot branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            dependabot/*) ;;
            *) echo "Refusing to delete a non-Dependabot branch." >&2; exit 1 ;;
          esac
          gh api --method DELETE \
            "repos/${GH_REPOSITORY}/git/refs/heads/${HEAD_REF}"
