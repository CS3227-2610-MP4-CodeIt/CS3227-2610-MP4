name: Code execution checks
on:
  workflow_dispatch:
  push:
    paths: ["code-execution/**", "specs/**", ".github/workflows/code-execution.yml"]
  pull_request:
    paths: ["code-execution/**", "specs/**", ".github/workflows/code-execution.yml"]
permissions:
  contents: read
jobs:
  executor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: code-execution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: code-execution/uv.lock
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy app
      - run: uv run --locked pytest -q
      - run: uv build
